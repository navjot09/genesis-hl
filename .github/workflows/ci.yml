name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            frontend/package-lock.json

      - name: Install (root — lint toolchain)
        run: npm ci

      - name: Install (functions)
        run: npm ci --prefix functions

      - name: Install (frontend)
        run: npm ci --prefix frontend

      - name: Lint
        run: npm run lint

      - name: Typecheck (functions)
        run: npm --prefix functions run typecheck

      - name: Unit tests + coverage gate (functions)
        run: npm --prefix functions run test:coverage

      - name: Typecheck + build (frontend)
        run: npx --prefix frontend vue-tsc --noEmit && npm --prefix frontend run build
